<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Mini Pitch Board -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="url(#pitch)" stroke="#22c55e" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Pitch lines -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="white" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="256" r="4" fill="white"/>
  
  <!-- Areas -->
  <rect x="180" y="86" width="152" height="56" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.6"/>
  <rect x="180" y="370" width="152" height="56" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Tactic nodes / players -->
  <circle cx="256" cy="385" r="14" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="150" cy="310" r="13" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="256" cy="320" r="13" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="362" cy="310" r="13" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="190" cy="215" r="13" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="322" cy="215" r="13" fill="#38bdf8" stroke="white" stroke-width="3"/>
  <circle cx="256" cy="140" r="15" fill="#f59e0b" stroke="white" stroke-width="3.5"/>

  <!-- Badge F7 Shield -->
  <g transform="translate(340, 340)">
    <circle cx="45" cy="45" r="44" fill="url(#gold)" stroke="#ffffff" stroke-width="3" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))"/>
    <text x="45" y="55" font-family="'Chakra Petch', sans-serif, Arial" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">F7</text>
  </g>
</svg>

